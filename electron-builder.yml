appId: com.yingbox.app
productName: 影盒
copyright: © 2024 影盒团队
directories:
  buildResources: build
  output: dist
asarUnpack:
  - resources/logo.ico
  # 按画面搜的推理运行时（原生模块 + 动态库）不能留在 asar 里
  - node_modules/onnxruntime-node/bin/**
beforePack: scripts/before-pack.mjs
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: licenses
    to: licenses
  - from: resources/third-party
    to: third-party
win:
  extraResources:
    - from: resources/mpv
      to: mpv
    - from: resources/mpv-sources
      to: third-party/mpv
  # 只带本平台 / 架构的推理运行时（每份 30–60 MB）
  files:
    - resources/logo.ico
    - out/**
    - package.json
    - '!**/*.map'
    - '!node_modules/onnxruntime-node/bin/napi-v6/{darwin,linux}/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**'
  executableName: 影盒
  icon: resources/logo.ico
  requestedExecutionLevel: asInvoker
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: 影盒-${version}-setup.${ext}
  shortcutName: 影盒
  uninstallDisplayName: 影盒
  installerIcon: resources/logo.ico
  uninstallerIcon: resources/logo.ico
  installerHeaderIcon: resources/logo.ico
  # 安装/卸载向导欢迎页与完成页左侧图（164×314 BMP）
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
mac:
  files:
    - out/**
    - package.json
    - '!**/*.map'
    - '!node_modules/onnxruntime-node/bin/napi-v6/{win32,linux}/**'
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  files:
    - out/**
    - package.json
    - '!**/*.map'
    - '!node_modules/onnxruntime-node/bin/napi-v6/{win32,darwin}/**'
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: Acefake
  repo: yingbox
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
