appId: com.yingbox.app
productName: 影盒
copyright: © 2024 影盒团队
directories:
  buildResources: build
  output: dist
files:
  # 只允许运行所需内容进 app.asar：out/ + package.json + node_modules(生产依赖)。
  # 其余仓库内容一律排除——否则 dist/、packages/、.claude/ 会把 asar 撑到几百 MB，
  # 既拖慢启动也让打包极易出错。
  - '!packages/**'
  - '!resources/**'
  - '!dist/**'
  - '!dist-web/**'
  - '!out-*/**'
  - '!output/**'
  - '!src/**'
  - '!tests/**'
  - '!scripts/**'
  - '!docs/**'
  - '!build/**'
  - '!.claude/**'
  - '!.codex_tmp/**'
  - '!.omo/**'
  - '!.commandcode/**'
  - '!.playwright-cli/**'
  - '!.github/**'
  - '!.vscode/**'
  - '!**/*.map'
  - '!**/*.md'
  - '!*.log'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vite.config.web.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,cjs}'
  - '!{tailwind.config.js,postcss.config.js,electron-builder.yml,cms-sites.json,vod-source-results.log}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
extraResources:
  - from: resources/amane
    to: amane
  - from: resources/mpv
    to: mpv
  - from: packages/services/backend/main.exe
    to: backend/main.exe
  - from: packages/services/backend/py
    to: backend/py
win:
  executableName: 影盒
  icon: resources/logo.ico
  requestedExecutionLevel: asInvoker
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  artifactName: 影盒-${version}-setup.${ext}
  shortcutName: 影盒
  uninstallDisplayName: 影盒
  installerIcon: resources/logo.ico
  uninstallerIcon: resources/logo.ico
  installerHeaderIcon: resources/logo.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: Acefake
  repo: yingbox
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
