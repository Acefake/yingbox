# 复制 docker/nas.env.example 为同目录的 .env 后填写目录与版本。
# 启动：docker compose -f docker-compose.nas.yml up -d
# 升级：修改 .env 的 YINGBOX_VERSION，再执行 pull 和 up -d。
services:
  yingbox:
    image: '${YINGBOX_IMAGE:-ghcr.io/acefake/yingbox-nas}:${YINGBOX_VERSION:?请填写已发布的 NAS 镜像版本}'
    container_name: yingbox-nas
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - '${YINGBOX_BIND:-0.0.0.0}:${YINGBOX_PORT:-31480}:31480'
    environment:
      PUID: '${PUID:-1000}'
      PGID: '${PGID:-1000}'
      TZ: Asia/Shanghai
      YINGBOX_HOST: '0.0.0.0'
      YINGBOX_SERVER_TOKEN: '${YINGBOX_SERVER_TOKEN:-}'
      YINGBOX_PUBLIC_ORIGIN: '${YINGBOX_PUBLIC_ORIGIN:-}'
    volumes:
      - '${YINGBOX_CONFIG_DIR:-./yingbox/config}:/config'
      - '${YINGBOX_CACHE_DIR:-./yingbox/cache}:/cache'
      - '${YINGBOX_MEDIA_DIR:?请填写 NAS 媒体目录}:/media'
