# 版本来源（2026-11-01 核对官方发布页）：
#   agp 9.5.0（要求 Gradle 9.6.0）、kotlin 2.4.10（AGP 发布说明示例）、
#   compose-bom 2026.08.00、tv-material 1.1.0、activity-compose 1.13.0、media3 1.11.1
# 这组版本 2026-11-01 在 JDK 17 + Android SDK 37 + 模拟器上构建、安装、启动通过。
[versions]
agp = "9.5.0"
kotlin = "2.4.10"
composeBom = "2026.08.00"
tvMaterial = "1.1.0"
activityCompose = "1.13.0"
media3 = "1.11.1"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-tv-material = { module = "androidx.tv:tv-material", version.ref = "tvMaterial" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# AGP 9 起内置 Kotlin 支持，不再需要 org.jetbrains.kotlin.android 插件
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
