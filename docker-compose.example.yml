# 影盒片库服务的 compose 示例（NAS / 家用服务器）。复制为 docker-compose.yml 后按需修改：
#   docker compose up -d --build
# 然后浏览器打开 http://<NAS 的 IP>:31480/?token=<下面的令牌>（只需第一次带令牌，之后靠 Cookie）。
# 详细说明：docs/library-server.md
services:
  yingbox:
    build: .
    image: yingbox-library:latest
    container_name: yingbox-library
    restart: unless-stopped
    # 与媒体文件属主一致（群晖 / 威联通可在用户管理里查 UID / GID），否则写 NFO、整理文件会没有权限
    user: '1000:1000'
    ports:
      - '31480:31480'
    environment:
      # 访问令牌：换成你自己的长随机串（不设则首次启动生成并打印在日志里）
      YINGBOX_SERVER_TOKEN: 'change-me-to-a-long-random-string'
      # TMDB 读访问令牌（电影 / 剧集库需要；番号库不需要），也可以在网页端的媒体库设置里填写
      # YINGBOX_TMDB_TOKEN: ''
      # 需要代理才能访问 TMDB / 番号站点时：
      # HTTPS_PROXY: 'http://192.168.1.2:7890'
      # HTTP_PROXY: 'http://192.168.1.2:7890'
      # NO_PROXY: 'localhost,127.0.0.1'
      # NODE_USE_ENV_PROXY: '1'
      TZ: Asia/Shanghai
    volumes:
      # 数据目录：片库数据库、海报缓存、密钥文件
      - ./yingbox-data:/data
      # 媒体目录：挂在 /media 下面（YINGBOX_MEDIA_ROOTS 默认 /media）。
      # 只读挂载（:ro）也能浏览和刮削，但写 NFO / 图片与整理改名需要可写。
      - /volume1/video/movies:/media/movies
      - /volume1/video/jav:/media/jav
