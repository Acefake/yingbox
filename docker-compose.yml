# 影盒片库服务的 compose 示例（NAS / 家用服务器），说明见 docs/deploy/nas.md，决策见 docs/adr/0010-docker-nas-deploy.md。
#
#   1. 在本文件旁边建 .env，写一行访问令牌（至少 24 个字符的随机串）：
#        echo "YINGBOX_SERVER_TOKEN=$(openssl rand -hex 32)" > .env
#   2. 按需改下面的 PUID / PGID、媒体目录、端口
#   3. docker compose up -d --build
#   4. 浏览器打开 http://127.0.0.1:31480/?token=<令牌>（只需第一次带令牌，之后靠 Cookie）
#
# 默认只有 NAS 本机（以及同机的反向代理）能访问。要让局域网直接访问，把 ports 改成 '31480:31480'；
# 想从外网访问，请走 HTTPS 反向代理，不要把端口直接映射到公网。
services:
  yingbox:
    build:
      context: .
      # 国内构建慢时换 npm 镜像；在线源要浏览器代抓时装 Chromium（镜像大约多 1 GB）：
      # args:
      #   NPM_REGISTRY: https://registry.npmmirror.com
      #   WITH_CHROMIUM: '1'
    image: yingbox-library:latest
    container_name: yingbox-library
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      # 宿主机地址:宿主机端口:容器端口。127.0.0.1 = 只本机（反代同机）可访问
      - '127.0.0.1:31480:31480'
    environment:
      # HTTPS 反向代理部署时设为浏览器访问的源（含非默认端口，不带路径）：
      # YINGBOX_PUBLIC_ORIGIN: https://media.example.com
      # 服务进程的 UID / GID（入口以 root 整理 /config、/cache 属主后降权）。
      # 设成媒体文件的属主（群晖 / 威联通在用户管理里查，或 ssh 上去 id <用户名>），否则读不到片库
      PUID: '1000'
      PGID: '1000'
      # 容器里监听所有地址，端口映射才能连进来；对外监听时服务要求下面的令牌，否则拒绝启动
      YINGBOX_HOST: '0.0.0.0'
      # 访问令牌：从 .env 读，没设置时 compose 直接报错
      YINGBOX_SERVER_TOKEN: '${YINGBOX_SERVER_TOKEN:?请在 .env 里设置 YINGBOX_SERVER_TOKEN（至少 24 个字符的随机串）}'
      # TMDB 读访问令牌（电影 / 剧集库需要），也可以在网页端的媒体库设置里填写
      # YINGBOX_TMDB_TOKEN: ''
      # 需要代理才能访问 TMDB / 刮削站点时（NODE_USE_ENV_PROXY 必须一起设）：
      # HTTPS_PROXY: 'http://192.168.1.2:7890'
      # HTTP_PROXY: 'http://192.168.1.2:7890'
      # NO_PROXY: 'localhost,127.0.0.1'
      # NODE_USE_ENV_PROXY: '1'
      # 目录监控：auto 本地盘用文件系统事件；网络盘 / FUSE 挂载（含 CloudDrive2）的库存储为「自动」时按网盘处理，
      # 不监听、不定时扫描，靠变更通知或手动扫描（见 docs/deploy/nas.md「CloudDrive2」）
      # YINGBOX_WATCH: 'auto'
      # 定时增量扫描间隔（秒）；网盘挂载目录很多时别太短
      # YINGBOX_SCAN_INTERVAL: '300'
      # 在线板块（ADR-0019）：默认开启；不需要时设 off（不起引擎、不开播放代理）
      # YINGBOX_ONLINE: 'off'
      # 被 Cloudflare 挑战拦下的在线源用无头 Chromium 代抓：构建时加 build.args WITH_CHROMIUM: '1'，再设
      # YINGBOX_BROWSER: 'chromium:/usr/bin/chromium'
      # 播放代理默认拒绝内网地址；局域网里的源（如自建 CMS / 媒体服务器）要显式放行，逗号分隔主机名、IP 或 IPv4 网段
      # YINGBOX_STREAM_ALLOW_PRIVATE: '192.168.1.0/24'
      TZ: Asia/Shanghai
    volumes:
      # 配置：片库数据库、密钥文件（必须备份）
      - ./yingbox/config:/config
      # 缓存：海报原图、缩略图、演员头像索引（可放 SSD；删了缩略图会重建，海报原图要刷新元数据才回来）
      - ./yingbox/cache:/cache
      # 下载：在线板块的番号下载落在这里（要可写；可以直接指向片库目录，下完自动入库）
      - ./yingbox/downloads:/downloads
      # 片库：挂在 /media 下面，只读。要写 NFO / 图片或整理改名时去掉 :ro
      - /volume1/video/movies:/media/movies:ro
      - /volume1/video/tv:/media/tv:ro
      # CloudDrive2 挂载的网盘（docs/deploy/nas.md「CloudDrive2」）：映射 CloudDrive2 的挂载根目录，
      # 传播用 rslave，CloudDrive2 重启 / 掉盘重挂后容器里才看得到新挂载
      # - type: bind
      #   source: /CloudNAS/115
      #   target: /media/115
      #   read_only: true
      #   bind:
      #     propagation: rslave
